<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azura Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f2ede2; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  .panel { background: rgba(12, 18, 26, 0.55); border-radius: 10px; padding: 8px 12px; }
  #stars { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 26px; letter-spacing: 4px; }
  #money { position: absolute; top: 14px; right: 16px; font-size: 22px; font-weight: 700; color: #7ee2a0; }
  #health-wrap { position: absolute; top: 52px; right: 16px; width: 170px; }
  #health-bar { height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #5ac25a; }
  #health-text { font-size: 12px; text-align: right; margin-top: 2px; }
  #objective-wrap { position: absolute; left: 16px; top: 14px; max-width: 340px; }
  #objective { font-size: 16px; font-weight: 600; }
  #objective-dist { font-size: 14px; color: #ffd24d; }
  #radio { position: absolute; left: 16px; bottom: 16px; font-size: 14px; }
  #speed { position: absolute; right: 216px; bottom: 16px; font-size: 22px; font-weight: 700; }
  #message { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 20px; font-weight: 600; text-align: center; transition: opacity 0.4s; background: rgba(12,18,26,0.6); padding: 10px 18px; border-radius: 10px; max-width: 640px; }
  #minimap-wrap { position: absolute; right: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,0.35); border-radius: 8px; overflow: hidden; }
  #minimap { display: block; width: 184px; height: 184px; }
  #hint { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 12px; color: rgba(242,237,226,0.75); }
  #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: rgba(10, 8, 6, 0.72); color: #f2ede2; text-align: center; z-index: 10; pointer-events: auto; }
  #screen-title { font-size: 64px; font-weight: 900; letter-spacing: 10px; color: #ffd24d; text-shadow: 0 4px 24px rgba(255, 160, 40, 0.5); margin: 0; }
  #screen-text { font-size: 17px; line-height: 1.6; max-width: 620px; margin: 18px 0 0; }
  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 0 12px 12px; pointer-events: none; z-index: 5; }
  #touch button { pointer-events: auto; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); background: rgba(12,18,26,0.55); color: #fff; font-size: 20px; margin: 3px; }
  @media (pointer: coarse) { #touch { display: flex; } #hint { display: none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Azura Bay: drive Mara Voss through a sun-soaked coastal city, steal cars, outrun the police and run jobs"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud">
  <div id="objective-wrap" class="panel"><div id="objective"></div><div id="objective-dist"></div></div>
  <div id="stars">☆☆☆☆☆</div>
  <div id="money" class="panel">$250</div>
  <div id="health-wrap"><div id="health-bar"><div id="health-fill"></div></div><div id="health-text">100</div></div>
  <div id="radio" class="panel">♪ SUNSET FM</div>
  <div id="speed"></div>
  <div id="message" style="opacity:0"></div>
  <div id="minimap-wrap"><canvas id="minimap" width="184" height="184"></canvas></div>
  <div id="hint"></div>
</div>
<div id="touch">
  <div>
    <button data-touch="left">◀</button>
    <button data-touch="right">▶</button>
  </div>
  <div>
    <button data-touch="enter">E</button>
    <button data-touch="punch">✊</button>
    <button data-touch="radio">♪</button>
  </div>
  <div>
    <button data-touch="back">▼</button>
    <button data-touch="forward">▲</button>
  </div>
</div>
<div id="screen"><h1 id="screen-title">AZURA BAY</h1><p id="screen-text"></p></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
